# EPPA + BİZİM SAĞLIK WINDOWS UYGULAMALARI — tek dosyalık derleme
# Kaydedilince GitHub, Windows kurulum dosyalarını (.exe) derler ve Releases'e koyar.
name: Windows uygulamalari
on:
  push:
    paths: ['.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Ortak dosyalar
        run: |
          mkdir -p ortak arac
          cat > ortak/main.js <<'DOSYA_SONU'
          /* MASAÜSTÜ UYGULAMASI (Windows) — siteyi kendi penceresinde açar.
             · Kapat'a basınca saat yanında (sistem tepsisi) çalışmaya devam eder → mesaj bildirimleri gelir.
             · Windows açılınca kendiliğinden başlar (tepsi menüsünden kapatılabilir).
             · Başka sitelere giden bağlantılar normal tarayıcıda açılır. */
          const {app, BrowserWindow, Tray, Menu, shell, ipcMain, nativeImage, session, Notification, dialog} = require('electron');
          const path = require('path');
          const fs = require('fs');
          const A = require('./ayar.json');

          app.setAppUserModelId(A.appId);
          if (!app.requestSingleInstanceLock()) { app.quit(); return; }

          let pen = null, tepsi = null, cikiyor = false;
          const durumDosyasi = path.join(app.getPath('userData'), 'pencere.json');
          const durumOku = () => { try { return JSON.parse(fs.readFileSync(durumDosyasi, 'utf8')); } catch (e) { return {ilk: true}; } };
          const durumYaz = (d) => { try { fs.writeFileSync(durumDosyasi, JSON.stringify(d)); } catch (e) {} };
          const ikon = path.join(__dirname, 'ikon.png');
          const kendiSitesi = (u) => { try { const h = new URL(u).hostname; return h === A.host || h.endsWith('.' + A.host); } catch (e) { return false; } };
          // PDF adresleri: …/pdf, …/pdf/ad.pdf, …-pdf/…, .pdf
          const pdfMi = (u) => /\.pdf(\?|#|$)|[\/-]pdf(\/|\?|#|$)|^data:application\/pdf/i.test(u);
          const pdfPencere = () => ({width: 1100, height: 900, autoHideMenuBar: true, icon: ikon, backgroundColor: '#525659',
              webPreferences: {partition: 'persist:' + A.kisa, plugins: true, spellcheck: false}});

          function goster() { if (!pen) return; if (pen.isMinimized()) pen.restore(); pen.show(); pen.focus(); }

          function pencere() {
              const d = durumOku();
              pen = new BrowserWindow({
                  width: d.w || 1280, height: d.h || 820, x: d.x, y: d.y, minWidth: 380, minHeight: 560,
                  title: A.ad, icon: ikon, backgroundColor: A.zemin, show: false, autoHideMenuBar: true,
                  webPreferences: {preload: path.join(__dirname, 'preload.js'), partition: 'persist:' + A.kisa, backgroundThrottling: false, spellcheck: false, plugins: true},
              });
              pen.setMenuBarVisibility(false);
              pen.once('ready-to-show', () => { if (d.ilk || d.buyuk) pen.maximize(); if (!process.argv.includes('--gizli')) pen.show(); });
              pen.webContents.setUserAgent(pen.webContents.getUserAgent().replace(/Electron\/\S+\s?/, '').replace(/\S+\/[\d.]+ (?=Chrome\/)/, '') + ' MasaustuUygulama/' + app.getVersion());
              pen.loadURL(A.url);

              // açılmazsa (internet yok ve daha önce hiç açılmamış) şık bir uyarı sayfası
              pen.webContents.on('did-fail-load', (e, kod, aciklama, url, anaCerceve) => {
                  if (!anaCerceve || kod === -3) return;
                  pen.loadFile(path.join(__dirname, 'baglanti.html'), {query: {u: url || A.url, ad: A.ad}});
              });
              // başka siteler → varsayılan tarayıcı; kendi sitemiz → aynı pencere; PDF → ayrı PDF penceresi
          pen.webContents.setWindowOpenHandler(({url}) => {
              const blob = /^(blob|data):/i.test(url);
              if (pdfMi(url) && (kendiSitesi(url) || blob)) return {action: 'allow', overrideBrowserWindowOptions: pdfPencere()};
              if (kendiSitesi(url)) { pen.loadURL(url); return {action: 'deny'}; }
              if (blob) return {action: 'allow', overrideBrowserWindowOptions: pdfPencere()};
              shell.openExternal(url); return {action: 'deny'};
          });
          pen.webContents.on('will-navigate', (e, url) => { if (!kendiSitesi(url) && !url.startsWith('file:')) { e.preventDefault(); shell.openExternal(url); } });
              // F5 yenile, Ctrl +/- yakınlaştır, Ctrl 0 sıfırla, F11 tam ekran
              pen.webContents.on('before-input-event', (e, i) => {
                  if (i.type !== 'keyDown') return;
                  const wc = pen.webContents;
                  if (i.key === 'F5' || (i.control && i.key.toLowerCase() === 'r')) { wc.reload(); e.preventDefault(); }
                  else if (i.key === 'F11') { pen.setFullScreen(!pen.isFullScreen()); e.preventDefault(); }
                  else if (i.control && (i.key === '+' || i.key === '=')) { wc.setZoomLevel(wc.getZoomLevel() + 0.5); e.preventDefault(); }
                  else if (i.control && i.key === '-') { wc.setZoomLevel(wc.getZoomLevel() - 0.5); e.preventDefault(); }
                  else if (i.control && i.key === '0') { wc.setZoomLevel(0); e.preventDefault(); }
                  else if (i.alt && i.key === 'ArrowLeft' && wc.canGoBack()) { wc.goBack(); e.preventDefault(); }
              });
              pen.on('focus', () => pen.flashFrame(false));
              pen.on('close', (e) => {
                  const b = pen.getNormalBounds();
                  durumYaz({x: b.x, y: b.y, w: b.width, h: b.height, buyuk: pen.isMaximized()});
                  if (cikiyor) return;
                  e.preventDefault(); pen.hide();
                  const d2 = durumOku();
                  if (!d2.tepsiBilgi && Notification.isSupported()) {
                      new Notification({title: A.ad + ' arka planda çalışıyor', body: 'Mesaj bildirimleri gelmeye devam edecek. Açmak için saat yanındaki simgeye tıklayın.', icon: ikon}).show();
                      durumYaz(Object.assign(d2, {tepsiBilgi: true}));
                  }
              });
          }

          function tepsiKur() {
              tepsi = new Tray(nativeImage.createFromPath(ikon).resize({width: 16, height: 16}));
              tepsi.setToolTip(A.ad);
              const menu = () => Menu.buildFromTemplate([
                  {label: A.ad + ' uygulamasını aç', click: goster},
                  {label: 'Sayfayı yenile', click: () => { goster(); pen.webContents.reload(); }},
                  {type: 'separator'},
                  {label: 'Windows açılınca başlat', type: 'checkbox', checked: app.getLoginItemSettings().openAtLogin,
                      click: (m) => app.setLoginItemSettings({openAtLogin: m.checked, args: ['--gizli']})},
                  {label: 'Sürüm ' + app.getVersion(), enabled: false},
                  {type: 'separator'},
                  {label: 'Çıkış', click: () => { cikiyor = true; app.quit(); }},
              ]);
              tepsi.setContextMenu(menu());
              tepsi.on('click', goster);
              tepsi.on('right-click', () => tepsi.setContextMenu(menu()));
          }

          app.whenReady().then(() => {
              const ses = session.fromPartition('persist:' + A.kisa);
              const izinli = ['notifications', 'geolocation', 'media', 'clipboard-read', 'clipboard-sanitized-write', 'fullscreen'];
              ses.setPermissionRequestHandler((wc, izin, cb) => cb(izinli.includes(izin)));
              ses.setPermissionCheckHandler((wc, izin) => izinli.includes(izin));
              // İndirmeler: İndirilenler klasörüne kaydet, bitince PDF'i aç / dosyayı klasörde göster
              ses.on('will-download', (e, item) => {
                  const klasor = app.getPath('downloads');
                  const ad = (item.getFilename() || 'dosya').replace(/[\\/:*?"<>|]+/g, '_');
                  const uz = path.extname(ad), kok = path.basename(ad, uz);
                  let yol = path.join(klasor, ad), i = 1;
                  while (fs.existsSync(yol)) yol = path.join(klasor, kok + ' (' + (i++) + ')' + uz);
                  item.setSavePath(yol);
                  item.on('updated', () => { if (pen && item.getTotalBytes()) pen.setProgressBar(item.getReceivedBytes() / item.getTotalBytes()); });
                  item.once('done', (ev, durum) => {
                      if (pen) pen.setProgressBar(-1);
                      if (durum !== 'completed') { if (Notification.isSupported()) new Notification({title: 'İndirme tamamlanamadı', body: ad, icon: ikon}).show(); return; }
                      if (/\.pdf$/i.test(yol)) shell.openPath(yol); else shell.showItemInFolder(yol);
                      if (Notification.isSupported()) new Notification({title: 'İndirildi', body: path.basename(yol) + ' — İndirilenler klasörüne kaydedildi', icon: ikon}).show();
                  });
              });
              // ilk kurulumda Windows açılışında başlasın
              const d = durumOku();
              if (d.ilk) { app.setLoginItemSettings({openAtLogin: true, args: ['--gizli']}); }
              pencere(); tepsiKur();
              if (d.ilk) durumYaz(Object.assign(durumOku(), {ilk: false}));
          });
          app.on('second-instance', goster);
          app.on('before-quit', () => { cikiyor = true; });
          app.on('window-all-closed', () => {});

          ipcMain.on('goster', goster);
          ipcMain.on('dikkat', () => { if (pen && !pen.isFocused()) pen.flashFrame(true); });
          ipcMain.handle('surum', () => app.getVersion());
          DOSYA_SONU
          cat > ortak/preload.js <<'DOSYA_SONU'
          /* Site ile uygulama arasındaki küçük köprü: bildirime tıklayınca pencereyi öne getir, görev çubuğunda yanıp sönsün */
          const {contextBridge, ipcRenderer} = require('electron');
          contextBridge.exposeInMainWorld('__masaustuUyg', {
              goster: () => ipcRenderer.send('goster'),
              dikkat: () => ipcRenderer.send('dikkat'),
              surum: () => ipcRenderer.invoke('surum'),
          });
          DOSYA_SONU
          cat > ortak/baglanti.html <<'DOSYA_SONU'
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Bağlantı yok</title>
          <style>
          html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f4f1ea;font-family:"Segoe UI",system-ui,sans-serif;color:#20242b}
          .k{background:#fff;border:1px solid #e6e1d6;border-radius:22px;padding:34px 30px;max-width:420px;text-align:center;box-shadow:0 30px 60px -40px rgba(0,0,0,.45)}
          .i{width:72px;height:72px;border-radius:50%;background:#eef4fa;display:grid;place-items:center;margin:0 auto 16px}
          h1{font-size:21px;margin:0 0 8px}p{color:#6c695f;line-height:1.55;margin:0 0 20px;font-size:14px}
          button{border:0;border-radius:13px;background:#1d72b8;color:#fff;font:700 14px "Segoe UI",sans-serif;padding:13px 26px;cursor:pointer}
          small{display:block;margin-top:14px;color:#9a958a;font-size:12px}
          </style></head><body><div class="k">
          <div class="i"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1d72b8" stroke-width="2" stroke-linecap="round"><path d="M2 2l20 20M8.5 16.5a5 5 0 017 0M5 12.9a10 10 0 015.2-2.8M19 12.9a10 10 0 00-2.4-1.7M1.5 8.8A15 15 0 016 6.2M22.5 8.8a15 15 0 00-9.8-3.7M12 20h.01"/></svg></div>
          <h1>İnternete bağlanılamadı</h1><p>Bağlantınızı kontrol edin. İnternet gelince <b id="ad">uygulama</b> kendiliğinden açılacak.</p>
          <button id="d">Tekrar dene</button><small id="s">Otomatik deneniyor…</small></div>
          <script>
          const q=new URLSearchParams(location.search),u=q.get('u');document.getElementById('ad').textContent=q.get('ad')||'Uygulama';
          const git=()=>location.href=u;document.getElementById('d').onclick=git;addEventListener('online',git);setInterval(()=>{if(navigator.onLine)git()},15000);
          </script></body></html>
          DOSYA_SONU
          cat > arac/ikon.js <<'DOSYA_SONU'
          // Simgeyi canlı siteden alır, kare yapar, 256 px PNG + ICO üretir
          const Jimp = require('jimp'); const toIco = require('png-to-ico'); const fs = require('fs');
          (async () => {
            const [klasor, ...adresler] = process.argv.slice(2); let im = null;
            for (const u of adresler) { try { const r = await fetch(u); if (!r.ok) continue; im = await Jimp.read(Buffer.from(await r.arrayBuffer())); console.log('simge:', u); break; } catch (e) {} }
            if (!im) throw new Error('Simge indirilemedi');
            im.autocrop(); const kenar = Math.max(im.bitmap.width, im.bitmap.height);
            const kare = new Jimp(Math.round(kenar * 1.12), Math.round(kenar * 1.12), 0xffffffff);
            kare.composite(im, Math.round((kare.bitmap.width - im.bitmap.width) / 2), Math.round((kare.bitmap.height - im.bitmap.height) / 2));
            kare.resize(256, 256);
            const png = await kare.getBufferAsync(Jimp.MIME_PNG);
            fs.writeFileSync(klasor + '/ikon.png', png); fs.writeFileSync(klasor + '/build/icon.png', png);
            const kucuk = await Promise.all([16, 24, 32, 48, 64, 128].map((s) => kare.clone().resize(s, s).getBufferAsync(Jimp.MIME_PNG)));
            fs.writeFileSync(klasor + '/build/icon.ico', await toIco([...kucuk, png]));
          })().catch((e) => { console.error(e); process.exit(1); });
          DOSYA_SONU
          cd arac && npm init -y >/dev/null && npm install --no-audit --no-fund jimp@0.22.12 png-to-ico@2.1.8
      - name: eppa projesi
        run: |
          mkdir -p eppa/build && cp ortak/* eppa/
          cat > eppa/package.json <<'DOSYA_SONU'
          {
           "name": "eppa-masaustu",
           "productName": "Eppa",
           "version": "1.0.1",
           "description": "Eppa — Medikal Saf Su servis yönetimi",
           "author": "EppaTech",
           "main": "main.js",
           "private": true,
           "build": {
            "appId": "online.medikalsafsu.masaustu",
            "productName": "Eppa",
            "copyright": "© EppaTech",
            "files": [
             "main.js",
             "preload.js",
             "baglanti.html",
             "ayar.json",
             "ikon.png"
            ],
            "directories": {
             "output": "dist",
             "buildResources": "build"
            },
            "win": {
             "target": [
              {
               "target": "nsis",
               "arch": [
                "x64"
               ]
              }
             ],
             "icon": "build/icon.ico",
             "artifactName": "Eppa-Kurulum.exe"
            },
            "nsis": {
             "oneClick": true,
             "perMachine": false,
             "createDesktopShortcut": "always",
             "createStartMenuShortcut": true,
             "shortcutName": "Eppa",
             "runAfterFinish": true,
             "deleteAppDataOnUninstall": false,
             "installerIcon": "build/icon.ico",
             "uninstallerIcon": "build/icon.ico",
             "uninstallDisplayName": "Eppa"
            },
            "electronVersion": "33.2.1",
            "compression": "maximum"
           },
           "devDependencies": {
            "electron": "33.2.1",
            "electron-builder": "25.1.8"
           }
          }
          DOSYA_SONU
          cat > eppa/ayar.json <<'DOSYA_SONU'
          {"ad": "Eppa", "kisa": "eppa", "appId": "online.medikalsafsu.masaustu", "host": "medikalsafsu.online", "url": "https://medikalsafsu.online/", "zemin": "#f4f1ea"}
          DOSYA_SONU
          node arac/ikon.js eppa https://medikalsafsu.online/icons/eppa-512.png https://medikalsafsu.online/icons/eppa-192.png https://medikalsafsu.online/images/epa/logo-mail.png
      - name: eppa derle
        working-directory: eppa
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          cp "dist/Eppa-Kurulum.exe" ../
      - name: bizimsaglik projesi
        run: |
          mkdir -p bizimsaglik/build && cp ortak/* bizimsaglik/
          cat > bizimsaglik/package.json <<'DOSYA_SONU'
          {
           "name": "bizimsaglik-masaustu",
           "productName": "Bizim Sağlık",
           "version": "1.0.1",
           "description": "Bizim Sağlık — teknik servis sistemi",
           "author": "EppaTech",
           "main": "main.js",
           "private": true,
           "build": {
            "appId": "online.bizimsaglik.masaustu",
            "productName": "Bizim Sağlık",
            "copyright": "© EppaTech",
            "files": [
             "main.js",
             "preload.js",
             "baglanti.html",
             "ayar.json",
             "ikon.png"
            ],
            "directories": {
             "output": "dist",
             "buildResources": "build"
            },
            "win": {
             "target": [
              {
               "target": "nsis",
               "arch": [
                "x64"
               ]
              }
             ],
             "icon": "build/icon.ico",
             "artifactName": "BizimSaglik-Kurulum.exe"
            },
            "nsis": {
             "oneClick": true,
             "perMachine": false,
             "createDesktopShortcut": "always",
             "createStartMenuShortcut": true,
             "shortcutName": "Bizim Sağlık",
             "runAfterFinish": true,
             "deleteAppDataOnUninstall": false,
             "installerIcon": "build/icon.ico",
             "uninstallerIcon": "build/icon.ico",
             "uninstallDisplayName": "Bizim Sağlık"
            },
            "electronVersion": "33.2.1",
            "compression": "maximum"
           },
           "devDependencies": {
            "electron": "33.2.1",
            "electron-builder": "25.1.8"
           }
          }
          DOSYA_SONU
          cat > bizimsaglik/ayar.json <<'DOSYA_SONU'
          {"ad": "Bizim Sağlık", "kisa": "bizimsaglik", "appId": "online.bizimsaglik.masaustu", "host": "bizimsaglik.online", "url": "https://bizimsaglik.online/servis/panel.php", "zemin": "#f4f1ea"}
          DOSYA_SONU
          node arac/ikon.js bizimsaglik https://bizimsaglik.online/icons/bs-512.png https://bizimsaglik.online/img/bizimsaglik-isaret.png https://bizimsaglik.online/img/bizimsaglik-logo.png
      - name: bizimsaglik derle
        working-directory: bizimsaglik
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
          cp "dist/BizimSaglik-Kurulum.exe" ../
      - uses: actions/upload-artifact@v4
        with: { name: windows-kurulum, path: "*-Kurulum.exe" }
      - name: İndirme sayfasına koy (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: Windows uygulamaları ${{ github.run_number }}
          files: |
            Eppa-Kurulum.exe
            BizimSaglik-Kurulum.exe
