name: CET

on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**/man/*'
      - '**.md'
      - '**.rdoc'
      - '**/.document'
      - '.*.yml'
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

permissions:
  contents: read

jobs:
  shstk:
    name: SHSTK
    runs-on: ubuntu-24.04

    container:
      image: fedora:44

    env:
      CONFIGURE_TTY: never
      RUBY_DEBUG: ci

    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          autoconf automake gcc gcc-c++ git libffi-devel libtool
          libyaml-devel make ncurses-devel openssl-devel procps-ng
          readline-devel ruby ruby-devel zlib-devel
        working-directory:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github
          persist-credentials: false

      - uses: ./.github/actions/setup/directories
        with:
          srcdir: src
          builddir: build
          makeup: true
          clean: true

      - name: Require userspace shadow-stack support
        run: |
          if ! grep -qw user_shstk /proc/cpuinfo; then
            echo '::error::The runner does not expose Intel CET shadow-stack support.'
            exit 1
          fi

      - name: Run configure
        run: >-
          ../src/configure -C
          --enable-debug-env
          --disable-install-doc
          --with-gcc="gcc -fcf-protection=return"

      - run: make

      - name: Test with shadow stacks enabled
        env:
          GLIBC_TUNABLES: glibc.cpu.x86_shstk=on
          RUBY_TESTOPTS: '-q --tty=no'
        run: |
          ./miniruby -e '
            line = File.foreach("/proc/self/status").find { |entry| entry.start_with?("x86_Thread_features:") }
            features = line&.split(":", 2)&.last&.split || []
            abort "SHSTK is not active (x86_Thread_features: #{features.join(" ")})" unless features.include?("shstk")
          '
          make -s test-all TESTS='test/ruby/test_fiber.rb test/ruby/test_continuation.rb'

defaults:
  run:
    working-directory: build
